# The dsh-computer-use bundle patch: one plugin composing the seam, the
# bundled Playwright provider, and the computer_* tools.

- insert:
    - id: tool-computer
      name: dsh-tool-computer
      config:
        provider:
          # Headless local Chrome at the Phase 0 calibration viewport.
          headless: true
          viewportWidth: 1280
          viewportHeight: 800
