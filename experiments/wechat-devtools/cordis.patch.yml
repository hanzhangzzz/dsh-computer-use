# Overlay: attach the computer tools to a CDP host (any Chromium app).
# headless has no plugin-installed entry, so this INSERTS one by absolute
# path (the loader resolves names against the profile dir, not the cwd).
# Point cdpEndpoint at your host. Verified against WeChat devtools (:9222)
# and a plain Chrome stand-in (:9224).

- insert:
    - id: tool-computer
      name: /Users/doing/Desktop/code/github/dsh-computer-use/packages/tool-computer/lib/index.js
      config:
        provider:
          cdpEndpoint: http://127.0.0.1:9222
