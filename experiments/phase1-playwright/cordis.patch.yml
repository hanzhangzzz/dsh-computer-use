# Phase 1 overlay: mount Playwright-MCP over `dsh --profile headless` and
# switch the agent to the vision model so browser screenshots flow through the
# MCP image bridge (attachment-local + ImageBlock) into the request.
#
# Run from the deepseek-harness repo root:
#   pnpm dsh --profile headless --patch <repo>/experiments/phase1-playwright/cordis.patch.yml "<task>"
#
# A patch replaces the targeted row's whole config, so `agent-default-model`
# restates both fields from dsh-base.

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- insert:
    # System Chrome via the `chrome` channel; `--headless --isolated` keeps the
    # demo side-effect-free. Viewport matches the Phase 0 ScreenSpot-v2
    # calibration (1280x800) so grounding error numbers stay comparable.
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@playwright/mcp@0.0.79'
          - '--browser'
          - chrome
          - '--headless'
          - '--isolated'
          - '--viewport-size'
          - '1280,800'
